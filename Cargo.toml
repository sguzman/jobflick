[package]
name = "jobflick"
version = "2.0.0"
edition = "2021"
description = "Clipboard-to-command queue and searchable result inbox for Linux"
license = "MIT"
repository = "https://github.com/sguzman/jobflick"

[dependencies]
anyhow = "1"
execarium = { git = "https://github.com/sguzman/execarium", rev = "79e2430362956c2790926c2498c970b9328159f4" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
