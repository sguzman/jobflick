name: Rust

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries and Fish
        run: sudo apt-get update && sudo apt-get install -y fish libwayland-dev libxkbcommon-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev pkg-config
      - run: cargo fmt --all
      - run: fish -n scripts/install.fish
      - run: cargo check
      - run: cargo test
      - run: cargo build
      - name: Concurrent on-demand startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          export XDG_CONFIG_HOME="$root/config"
          export XDG_DATA_HOME="$root/data"
          export XDG_RUNTIME_DIR="$root/runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          bin="./target/debug/jobflick"

          # All clients start without a daemon. They must share one
          # startup attempt rather than racing to launch 12 instances.
          pids=()
          for i in $(seq 1 12); do
            "$bin" list >"$root/client-$i.out" 2>"$root/client-$i.err" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          for i in $(seq 1 12); do
            grep -q 'No jobs in the inbox' "$root/client-$i.out"
          done
          test -S "$XDG_RUNTIME_DIR/jobflick/daemon.sock"

          # Verify actual execution through the shared daemon.
          queued="$("$bin" submit -- 'printf launch_race_ok')"
          id="$(awk '{print $2}' <<<"$queued")"
          for i in $(seq 1 80); do
            if "$bin" list | grep -q 'Succeeded.*printf launch_race_ok'; then break; fi
            sleep 0.1
          done
          "$bin" show "$id" | grep -q launch_race_ok

      - name: Stalled desktop notifications do not block jobs
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          export XDG_CONFIG_HOME="$root/config"
          export XDG_DATA_HOME="$root/data"
          export XDG_RUNTIME_DIR="$root/runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" "$root/mockbin"
          cat > "$root/mockbin/notify-send" <<'EOF'
          #!/bin/sh
          exec sleep 30
          EOF
          chmod 700 "$root/mockbin/notify-send"
          export PATH="$root/mockbin:$PATH"
          bin="./target/debug/jobflick"
          "$bin" daemon >"$root/daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; rm -rf "$root"' EXIT
          for i in $(seq 1 100); do
            if test -S "$XDG_RUNTIME_DIR/jobflick/daemon.sock"; then break; fi
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/jobflick/daemon.sock"
          queued="$("$bin" submit -- 'printf notifications_must_not_block')"
          id="$(awk '{print $2}' <<<"$queued")"
          for i in $(seq 1 80); do
            if "$bin" list | grep -q 'Succeeded.*printf notifications_must_not_block'; then break; fi
            sleep 0.1
          done
          "$bin" list | grep -q 'Succeeded.*printf notifications_must_not_block'
          "$bin" show "$id" | grep -q 'notifications_must_not_block'

      - name: Crash recovery does not replay active jobs
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          export XDG_CONFIG_HOME="$root/config"
          export XDG_DATA_HOME="$root/data"
          export XDG_RUNTIME_DIR="$root/runtime"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/jobflick" "$XDG_DATA_HOME"
          printf 'max_concurrent = 1\n' > "$XDG_CONFIG_HOME/jobflick/config.toml"
          bin="./target/debug/jobflick"
          daemon_pid=""
          cleanup() {
            if [[ -n "$daemon_pid" ]]; then kill "$daemon_pid" 2>/dev/null || true; fi
            if [[ -f "$XDG_RUNTIME_DIR/worker.pid" ]]; then
              pgid="$(cat "$XDG_RUNTIME_DIR/worker.pid")"
              if [[ "$pgid" =~ ^[0-9]+$ ]]; then
                kill -KILL -- "-$pgid" 2>/dev/null || true
              fi
            fi
            rm -rf "$root"
          }
          trap cleanup EXIT

          "$bin" daemon >"$root/first-daemon.log" 2>&1 &
          daemon_pid=$!
          for i in $(seq 1 100); do
            if test -S "$XDG_RUNTIME_DIR/jobflick/daemon.sock"; then break; fi
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/jobflick/daemon.sock"

          # Persist one Running, one Queued and one Cancelled record.
          # The worker writes its private process-group leader PID so this
          # test can clean up the orphan after killing the daemon.
          active_line="$("$bin" submit -- 'echo $fish_pid > "$XDG_RUNTIME_DIR/worker.pid"; sleep 60; echo unsafe_replay > "$XDG_DATA_HOME/replayed"')"
          active_id="$(awk '{print $2}' <<<"$active_line")"
          for i in $(seq 1 100); do
            if test -s "$XDG_RUNTIME_DIR/worker.pid"; then break; fi
            sleep 0.05
          done
          test -s "$XDG_RUNTIME_DIR/worker.pid"
          pending_line="$("$bin" submit -- 'echo recovered_ok > "$XDG_DATA_HOME/recovered"')"
          pending_id="$(awk '{print $2}' <<<"$pending_line")"
          cancel_line="$("$bin" submit -- 'echo incorrect_replay > "$XDG_DATA_HOME/cancelled"')"
          cancel_id="$(awk '{print $2}' <<<"$cancel_line")"
          "$bin" cancel "$cancel_id" > /dev/null
          "$bin" list | grep -E 'Queued.*recovered_ok'
          "$bin" list | grep -E 'Running.*worker.pid'

          # Abrupt daemon termination. Jobflick must not infer that a
          # previously Running command is safe to replay.
          kill -KILL "$daemon_pid"
          wait "$daemon_pid" 2>/dev/null || true
          daemon_pid=""
          pgid="$(cat "$XDG_RUNTIME_DIR/worker.pid")"
          kill -KILL -- "-$pgid" 2>/dev/null || true
          rm -f "$XDG_RUNTIME_DIR/worker.pid"

          "$bin" daemon >"$root/restarted-daemon.log" 2>&1 &
          daemon_pid=$!
          for i in $(seq 1 100); do
            if "$bin" list --all >/dev/null 2>&1; then break; fi
            sleep 0.05
          done
          "$bin" list --all | grep -E 'Interrupted.*worker.pid'
          "$bin" list --all | grep -E 'Cancelled.*incorrect_replay'
          for i in $(seq 1 100); do
            if "$bin" list | grep -E 'Succeeded.*recovered_ok'; then break; fi
            sleep 0.05
          done
          "$bin" show "$active_id" | grep -q 'Status: Interrupted'
          "$bin" show "$pending_id" | grep -q 'Status: Succeeded'
          "$bin" show "$cancel_id" | grep -q 'Status: Cancelled'
          test -f "$XDG_DATA_HOME/recovered"
          test ! -e "$XDG_DATA_HOME/replayed"
          test ! -e "$XDG_DATA_HOME/cancelled"

          # Repeated restarts must preserve terminal records, never rerun.
          kill "$daemon_pid"
          wait "$daemon_pid" 2>/dev/null || true
          daemon_pid=""
          "$bin" daemon >"$root/third-daemon.log" 2>&1 &
          daemon_pid=$!
          for i in $(seq 1 100); do
            if "$bin" list --all >/dev/null 2>&1; then break; fi
            sleep 0.05
          done
          "$bin" show "$active_id" | grep -q 'Status: Interrupted'
          "$bin" show "$pending_id" | grep -q 'Status: Succeeded'
          "$bin" show "$cancel_id" | grep -q 'Status: Cancelled'
          test ! -e "$XDG_DATA_HOME/replayed"
          test ! -e "$XDG_DATA_HOME/cancelled"

      - name: CLI and queue smoke test
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          export XDG_CONFIG_HOME="$root/config"
          export XDG_DATA_HOME="$root/data"
          export XDG_RUNTIME_DIR="$root/runtime"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/jobflick"
          printf 'max_concurrent = 1\n' > "$XDG_CONFIG_HOME/jobflick/config.toml"
          bin="./target/debug/jobflick"
          "$bin" daemon > "$root/daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; rm -rf "$root"' EXIT
          sleep 1
          first="$("$bin" submit -- 'sleep 2; printf first_finished')"
          first_id="$(awk '{print $2}' <<<"$first")"
          second="$("$bin" submit -- 'printf second_finished')"
          second_id="$(awk '{print $2}' <<<"$second")"
          third="$("$bin" submit -- 'printf must_not_run')"
          third_id="$(awk '{print $2}' <<<"$third")"
          "$bin" cancel "$third_id"
          "$bin" show "$third_id" | grep -q 'Status: Cancelled'
          "$bin" list | grep -E "Queued.*printf second_finished"
          for i in $(seq 1 80); do
            if "$bin" list | grep -q "Succeeded.*printf second_finished"; then break; fi
            sleep 0.1
          done
          "$bin" show "$first_id" | grep -q first_finished
          "$bin" show "$second_id" | grep -q second_finished
          "$bin" consume "$first_id"
          if "$bin" list | grep -q "$first_id"; then exit 1; fi
          "$bin" restore "$first_id"
          "$bin" list | grep -q "$first_id"
          # A running job must be stopped without restarting the scheduler.
          run_line="$("$bin" submit -- 'sleep 60; printf never_finished')"
          run_id="$(awk '{print $2}' <<<"$run_line")"
          for i in $(seq 1 80); do
            if "$bin" list | grep -E 'Running.*sleep 60'; then break; fi
            sleep 0.1
          done
          "$bin" list | grep -E 'Running.*sleep 60'
          "$bin" cancel "$run_id" | grep -q 'Stop requested'
          "$bin" cancel "$run_id" >/dev/null
          for i in $(seq 1 80); do
            if "$bin" list | grep -E 'Cancelled.*sleep 60'; then break; fi
            sleep 0.1
          done
          "$bin" list | grep -E 'Cancelled.*sleep 60'
          "$bin" show "$run_id" | grep -q 'Status: Cancelled'
          if "$bin" show "$run_id" | sed -n '/^Output:/,/^Saved log:/p' | grep -q never_finished; then exit 1; fi
          next_line="$("$bin" submit -- 'printf slot_released')"
          next_id="$(awk '{print $2}' <<<"$next_line")"
          for i in $(seq 1 80); do
            if "$bin" list | grep -q 'Succeeded.*printf slot_released'; then break; fi
            sleep 0.1
          done
          "$bin" show "$next_id" | grep -q slot_released
          # The normal child of a nested shell must also stop. A zombie is
          # acceptable briefly; a live sleeping descendant is not.
          cat > "$root/descendant.sh" <<'EOF'
          #!/bin/sh
          sleep 60 &
          echo "$!" > "$XDG_RUNTIME_DIR/descendant.pid"
          wait
          EOF
          chmod 700 "$root/descendant.sh"
          nested_line="$("$bin" submit -- "sh $root/descendant.sh")"
          nested_id="$(awk '{print $2}' <<<"$nested_line")"
          for i in $(seq 1 80); do
            if test -s "$XDG_RUNTIME_DIR/descendant.pid"; then break; fi
            sleep 0.1
          done
          test -s "$XDG_RUNTIME_DIR/descendant.pid"
          descendant="$(cat "$XDG_RUNTIME_DIR/descendant.pid")"
          kill -0 "$descendant"
          "$bin" cancel "$nested_id" >/dev/null
          for i in $(seq 1 80); do
            if "$bin" list | grep -E 'Cancelled.*descendant.sh'; then break; fi
            sleep 0.1
          done
          "$bin" list | grep -E 'Cancelled.*descendant.sh'
          if ps -o stat= -p "$descendant" 2>/dev/null | grep -Eq '^[[:space:]]*[^Z[:space:]]'; then
            echo "Running descendant survived cancellation" >&2
            exit 1
          fi
