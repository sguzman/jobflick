name: Dispatch owner-approved Jobflick 2.0.0 release

# One-time bridge because connected GitHub API does not expose workflow_dispatch.
# This file is removed after publication. Existing release.yml retains every gate.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v2-approved-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'release: initiate owner-approved Jobflick v2.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the existing verified and manually gated release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field version=2.0.0 \
            --field desktop_acceptance_confirmed=true
